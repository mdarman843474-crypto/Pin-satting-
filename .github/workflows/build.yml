name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then echo "Repo me .zip file nahi mili"; exit 1; fi
          mkdir -p src_unzipped
          unzip -q -o "$ZIP" -d src_unzipped
          SETTINGS=$(find src_unzipped -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          if [ -z "$SETTINGS" ]; then echo "Zip me settings.gradle.kts nahi mili"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PinSettings-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
